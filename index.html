<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Javilindj</title>
	<style>
		body {
			margin: 0;
			background: #0d0018;
			color: #fff;
			font-family: Arial, sans-serif;
		}

		.banner {
			width: 100%;
			display: block;
		}

		.banner img {
			display: block;
			width: 100%;
			height: auto;
		}

		.sessions-title {
			margin: 2rem 0 1.25rem;
			color: #b7ff00;
			font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
			font-size: 3rem;
			font-weight: 900;
			letter-spacing: 0.12em;
			line-height: 1;
			text-align: center;
			text-shadow: 0 0 5px #b7ff00, 0 0 16px #72ff00, 0 0 30px rgba(114, 255, 0, 0.8);
			text-transform: uppercase;
		}

		.mixcloud-player {
			width: 100%;
			margin: 2rem 0;
			padding: 0 0.75rem;
			box-sizing: border-box;
		}

		.mixcloud-player iframe {
			display: block;
			width: 100%;
			min-height: 180px;
			border: 0;
            border-radius: 12px;
		}

		.mix-item {
			margin-bottom: 1.5rem;
		}

		.session-info {
			margin: 0.5rem 0 0;
			color: #d8c6e8;
			font-size: 0.95rem;
		}

		footer {
			padding: 1.5rem;
			color: #fff;
			text-align: center;
			background: #0d0018;
		}
	</style>
</head>
<body>
	<header class="banner">
		<img src="media/banner.png" alt="Javilindj">
	</header>

	<h1 class="sessions-title">Mis sesiones</h1>

	<section class="mixcloud-player" aria-label="Reproductor de Mixcloud">
		<article class="mix-item">
			<iframe
			title="Reproductor de Mixcloud de Javilindj"
			src="https://www.mixcloud.com/widget/iframe/?hide_cover=1&feed=%2Fjavilindj%2F"
			allow="autoplay">
			</iframe>
			<p class="session-info">Sesión hard especial 40 cumpleaños.</p>
		</article>
        <article class="mix-item">
			<iframe
			title="Reproductor de Mixcloud de Javilindj"
			src="https://player-widget.mixcloud.com/widget/iframe/?hide_cover=1&feed=%2Fjavilindj%2Fmoonvember%2F&utm_medium=share&utm_source=embed&utm_content=show&utm_term=ODEyM2QxYmNfZTg0ZV80YzE1Xzk1Y2FfNmE1NWZiOTBkMTI1"
			allow="autoplay">
			</iframe>
			<p class="session-info">Sesión hard noviembre 2024.</p>
			</p>
		</article>
        
	</section>
	<footer>
		javilindj — Todos los derechos reservados © <span id="current-year"></span>
	</footer>
	<script>
		document.getElementById('current-year').textContent = new Date().getFullYear();
	</script>
</body>
</html>
